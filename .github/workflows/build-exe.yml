name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install .
          pytest -v

  build:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --name Propogate-Kodi-Config main.py

      - name: Package distribution zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item dist/Propogate-Kodi-Config.exe dist/package/
          Copy-Item config.ini.sample dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath dist/Propogate-Kodi-Config-windows.zip

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/Propogate-Kodi-Config.exe release/
          Copy-Item dist/Propogate-Kodi-Config-windows.zip release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Propogate-Kodi-Config-windows
          path: release/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Propogate-Kodi-Config-windows
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/Propogate-Kodi-Config.exe
            release/Propogate-Kodi-Config-windows.zip
